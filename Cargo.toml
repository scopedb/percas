[workspace]
members = [
  "client",
  "cmd/percas",
  "crates/gossip",
  "crates/core",
  "crates/metrics",
  "crates/server",
  "crates/version",
  "tests",
  "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/scopedb/percas/"
version = "0.4.0"

[workspace.dependencies]
# Workspace published members
percas-client = { path = "client" }

# Workspace unpublished members
percas = { path = "cmd/percas" }
percas-core = { path = "crates/core" }
percas-gossip = { path = "crates/gossip" }
percas-metrics = { path = "crates/metrics" }
percas-server = { path = "crates/server" }
percas-version = { path = "crates/version" }

# Crates.io dependencies
anstyle = { version = "1.0.14" }
arc-swap = { version = "1.9.2" }
backon = { version = "1.6.0" }
build-data = { version = "0.3.3" }
bytesize = { version = "2.7.0", features = ["serde"] }
cache2 = { version = "0.6.0" }
clap = { version = "4.6.7", features = ["derive"] }
const_format = { version = "0.2.36" }
criterion = { version = "0.8.2", features = ["async_tokio"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
exn = { version = "0.3.1" }
fastimer = { version = "0.10.0" }
fastrace = { version = "0.7.19" }
fastrace-opentelemetry = { version = "0.18.1" }
fastrace-reqwest = { version = "0.3.0" }
foyer = { version = "0.22.6", features = ["nightly"] }
futures-util = { version = "0.3.34" }
gix-discover = { version = "0.55.0", features = ["sha1"] }
googletest = { version = "0.14.3" }
indent = { version = "0.1.1" }
insta = { version = "1.48.0", features = ["json", "toml", "redactions"] }
jemallocator = { version = "0.5.4" }
jiff = { version = "0.2.37", features = ["serde"] }
local-ip-address = { version = "0.6.13" }
log = { version = "0.4.34", features = ["kv"] }
logforth = { version = "0.30.1", features = [
  "append-fastrace",
  "append-opentelemetry",
  "diagnostic-fastrace",
  "starter-log",
] }
mea = { version = "0.6.7" }
mixtrics = { version = "0.2.5", features = ["opentelemetry_0_32"] }
mur3 = { version = "0.1.0" }
# Keep OpenTelemetry aligned with logforth and fastrace-opentelemetry.
opentelemetry = { version = "0.32.0", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "internal-logs",
] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "grpc-tonic",
  "http-proto",
  "internal-logs",
] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "rt-tokio",
  "internal-logs",
] }
parse-display = { version = "0.11.0" }
pin-project = { version = "1.1.13" }
poem = { version = "3.1.12" }
pretty-hex = { version = "0.4.2" }
pretty_assertions = { version = "1.4.1" }
rand = { version = "0.10.3" }
regex = { version = "1.13.1" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
schemars = { version = "1.2.2", features = ["jiff02", "url2"] }
scopeguard = { version = "1.2.0" }
sealed_test = { version = "1.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
shadow-rs = { version = "2.0.0", default-features = false }
sysinfo = { version = "0.39.6" }
tempfile = { version = "3.27.0" }
test-harness = { version = "0.3.1" }
tokio = { version = "1.53.1" }
toml_edit = { version = "0.25.15" }
unindent = { version = "0.2.4" }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[workspace.lints.rust]
unknown_lints = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
field_reassign_with_default = "allow"
manual_range_contains = "allow"
new_without_default = "allow"

[profile.release]
debug = true
lto = "thin"

[profile.dist]
codegen-units = 1
debug = true
inherits = "release"
lto = "fat"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
